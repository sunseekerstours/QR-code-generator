<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="50%" stop-color="#F57C00" />
      <stop offset="100%" stop-color="#D84315" />
    </linearGradient>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <circle cx="120" cy="120" r="114" fill="url(#sunGlow)" filter="url(#shadow)" />
  <circle cx="120" cy="120" r="106" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" />
  
  <!-- Stylized Rising Sun Arc -->
  <path d="M 60 140 A 60 60 0 0 1 180 140 Z" fill="#FFE082" opacity="0.65" />
  <circle cx="120" cy="100" r="28" fill="#FFF8E1" />
  
  <!-- Modern Coach Outline -->
  <g transform="translate(48, 95) scale(0.6)">
    <!-- Bus Body -->
    <path d="M 30 25 C 30 15, 45 10, 70 10 L 170 10 C 195 10, 210 15, 210 25 L 210 100 C 210 106, 205 110, 200 110 L 190 110 C 190 98, 175 98, 175 110 L 65 110 C 65 98, 50 98, 50 110 L 40 110 C 35 110, 30 106, 30 100 Z" fill="url(#busGrad)" filter="url(#shadow)" />
    <!-- Windshield & Windows -->
    <path d="M 40 28 L 85 28 L 85 58 L 40 58 Z" fill="#0F172A" rx="4" />
    <path d="M 95 28 L 140 28 L 140 58 L 95 58 Z" fill="#0F172A" rx="4" />
    <path d="M 150 28 L 195 28 L 195 58 L 150 58 Z" fill="#0F172A" rx="4" />
    <!-- Headlights -->
    <circle cx="48" cy="85" r="7" fill="#FBBF24" />
    <circle cx="192" cy="85" r="7" fill="#FBBF24" />
    <!-- Wheels -->
    <circle cx="57" cy="110" r="14" fill="#1E293B" />
    <circle cx="57" cy="110" r="6" fill="#94A3B8" />
    <circle cx="183" cy="110" r="14" fill="#1E293B" />
    <circle cx="183" cy="110" r="6" fill="#94A3B8" />
  </g>
  
  <!-- Speed Lines / Road -->
  <line x1="45" y1="172" x2="195" y2="172" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <line x1="75" y1="182" x2="165" y2="182" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.5" />
</svg>
